        <ellipse cx="0" cy="-10" rx="3.6" ry="8.5" transform="rotate(45)" fill="#1F3FA8" fill-opacity=".14"/>
        <ellipse cx="0" cy="-10" rx="3.6" ry="8.5" transform="rotate(90)" fill="#1F3FA8" fill-opacity=".14"/>
        <ellipse cx="0" cy="-10" rx="3.6" ry="8.5" transform="rotate(135)" fill="#1F3FA8" fill-opacity=".14"/>
        <ellipse cx="0" cy="-10" rx="3.6" ry="8.5" transform="rotate(180)" fill="#1F3FA8" fill-opacity=".14"/>
        <ellipse cx="0" cy="-10" rx="3.6" ry="8.5" transform="rotate(225)" fill="#1F3FA8" fill-opacity=".14"/>
        <ellipse cx="0" cy="-10" rx="3.6" ry="8.5" transform="rotate(270)" fill="#1F3FA8" fill-opacity=".14"/>
        <ellipse cx="0" cy="-10" rx="3.6" ry="8.5" transform="rotate(315)" fill="#1F3FA8" fill-opacity=".14"/>
