        <circle cx="0" cy="-20.5" r="1.3"/><circle cx="14.5" cy="-14.5" r="1.3"/><circle cx="20.5" cy="0" r="1.3"/><circle cx="14.5" cy="14.5" r="1.3"/>
        <circle cx="0" cy="20.5" r="1.3"/><circle cx="-14.5" cy="14.5" r="1.3"/><circle cx="-20.5" cy="0" r="1.3"/><circle cx="-14.5" cy="-14.5" r="1.3"/>
