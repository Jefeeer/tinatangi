<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Figtree,sans-serif;background:#170d08;color:#f6ead2;position:relative}
.photo{position:absolute;inset:0 0 0 360px;background:url(../../public/photos/dusk-counter.jpg) center 40%/cover}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#170d08 0%,#170d08ee 18%,#170d0899 42%,#170d0811 70%,transparent),linear-gradient(0deg,#170d08cc 0%,transparent 35%)}
.plate{position:absolute;left:0;right:0;bottom:0;height:14px;background:url(../../public/brand/plate-band.svg) repeat-x center/auto 14px;opacity:.9}
.content{position:absolute;left:72px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.badge{width:132px;height:auto;filter:drop-shadow(0 10px 24px #0008)}
.eyebrow{font-size:18px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#f2a31b}
h1{font-size:64px;line-height:1.02;font-weight:700;letter-spacing:-.02em}
p{font-size:24px;line-height:1.35;color:#d8c7a6;max-width:470px}
.chips{display:flex;gap:10px;margin-top:4px}
.chip{font-size:18px;font-weight:600;padding:10px 18px;border-radius:999px;background:#f2a31b;color:#2a140c}
.chip.ghost{background:#f6ead214;color:#f6ead2;border:1.5px solid #f6ead244}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2a140c;margin-right:9px;vertical-align:2px}
</style></head><body>
<div class="photo"></div>
<div class="content">
  <img class="badge" src="../../public/brand/badge.png" alt="">
  <div class="eyebrow">Tinatangi Café</div>
  <h1>Kape sa hardin.</h1>
  <p>A fairy-lit garden cafe in Salawag, Dasmariñas, Cavite.</p>
  <div class="chips"><span class="chip"><span class="dot"></span>Open daily · 7 AM – 12 MN</span><span class="chip ghost">Pet-friendly</span></div>
</div>
<div class="plate"></div>
</body></html>
